<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Герой — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .h-layout { grid-template-columns: 1fr 340px; grid-template-rows: 1fr; }
  .paperdoll { position: relative; width: 260px; margin: 0 auto; }
  .pd-grid { display: grid; grid-template-columns: 56px 1fr 56px; grid-template-rows: repeat(9, 48px); gap: 8px; align-items: center; justify-items: center; }
  .slot { width: 48px; height: 48px; border-radius: 9px; background: #05070c; border: 1px solid #2a3049;
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .slot img { width: 42px; height: 42px; border-radius: 6px; }
  .slot.empty::after { content: ''; }
  .slot.has { border-color: #3a4258; }
  .slot .q { position: absolute; inset: 0; border-radius: 8px; pointer-events: none; }
  .char-head { text-align: center; margin-bottom: 10px; }
  .char-head .nm { font-size: 21px; font-weight: 800; color: #fff; }
  .char-head .sub { color: var(--dim); font-size: 12.5px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .stat-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
  .stat-box .v { font-weight: 800; color: var(--gold2); font-size: 16px; }
  .stat-box .l { font-size: 11px; color: var(--dim); }
  .import { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .import textarea { flex: 0 0 auto; height: 120px; background: #0a0c12; color: #9fb0d0; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11.5px; resize: none; }
  .steps { display: flex; flex-direction: column; gap: 7px; }
  .step { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; }
  .step .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--gold);
    color: var(--gold2); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .tipcard { position: fixed; z-index: 100; display: none; max-width: 300px; background: #0b0d14; border: 1px solid var(--gold);
    border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
  .tipcard b { color: #fff; font-size: 13.5px; }
  .tipcard .ilvl { color: var(--dim); font-size: 11.5px; }
  .demo-btn { align-self: flex-start; }
  @media (max-width: 980px) {
    .h-layout { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .import textarea { height: 90px; }
  }
</style>
</head>
<body>
<div id="app">
<main>
  <div class="grid h-layout">
    <section class="card" id="doll">
      <div class="char-head">
        <div class="nm" id="cname" data-ru="Твой герой" data-en="Your hero">Твой герой</div>
        <div class="sub" id="csub" data-ru="Импортируй данные справа →" data-en="Import data on the right →">Импортируй данные справа →</div>
      </div>
      <div class="paperdoll">
        <div class="pd-grid" id="pd"></div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card import">
      <h2><img class="ic" src="https://wow.zamimg.com/images/wow/icons/large/ability_warrior_battleshout.jpg" alt="">
        <span data-ru="Импорт из игры" data-en="Import from game">Импорт из игры</span>
        <span id="hintSlot"></span></h2>
      <div class="steps">
        <div class="step"><span class="n">1</span><div data-ru="В игре набери /macro, создай два новых макроса и вставь в них строки ниже. Нажимай кнопку МАКРОСА на панели — не отправляй строку в чат!" data-en="In game type /macro, create two new macros and paste the lines below into them. Press the MACRO BUTTON on your action bar — do not send the line to chat!">В игре набери /macro, создай два новых макроса и вставь в них строки ниже. Нажимай кнопку МАКРОСА на панели — не отправляй строку в чат!</div></div>
        <div class="step"><span class="n">2</span><div data-ru="Открой чат, выдели строки WEXP|… и скопируй (Ctrl+C)." data-en="Open chat, select the WEXP|… lines and copy (Ctrl+C).">Открой чат, выдели строки WEXP|… и скопируй (Ctrl+C).</div></div>
        <div class="step"><span class="n">3</span><div data-ru="Вставь их сюда и нажми «Показать»." data-en="Paste them here and press Show.">Вставь их сюда и нажми «Показать».</div></div>
      </div>
      <div class="macro-box" id="m1"></div>
      <div class="macro-box" id="m2"></div>
      <textarea id="paste" placeholder="WEXP1|…&#10;WEXP0|…&#10;WEXP2|1|…"></textarea>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="show" data-ru="Показать" data-en="Show">Показать</button>
        <button class="btn ghost demo-btn" id="demo" data-ru="Демо-герой" data-en="Demo hero">Демо-герой</button>
        <button class="btn ghost demo-btn" id="clear" data-ru="Очистить" data-en="Clear">Очистить</button>
      </div>
    </section>
  </div>
</main>
</div>
<div class="tipcard" id="itemtip"></div>
<script src="assets/js/app.js"></script>
<script src="assets/js/macros-data.js"></script>
<script src="assets/js/talents-data.js"></script>
<script>
(() => {
  const lang = window.W.lang;
  const L = {
    ru: { slots: SLOTS_RU, copy: 'копировать', hint: 'Аддон не нужен: экспорт делают два коротких /run-макроса. Важно: в игре нажимай кнопку МАКРОСА, а не отправляй строку в чат — из чата она не работает. Годится любой клиент 3.3.5a.', err: 'Не нашёл строк WEXP|… — проверь, что скопировал их из чата целиком.' },
    en: { slots: SLOTS_EN, copy: 'copy', hint: 'No addon needed: the export is done by two short /run macros. Important: in game press the MACRO BUTTON, do not paste the line into chat — it does nothing from chat. Works on any 3.3.5a client.', err: 'No WEXP|… lines found — make sure you copied them fully from chat.' },
  };
  function SLOTS_RU() { return { 1: 'Голова', 2: 'Шея', 3: 'Плечи', 15: 'Спина', 5: 'Грудь', 4: 'Рубашка', 19: 'Гербовая накидка', 9: 'Запястья', 10: 'Кисти рук', 6: 'Пояс', 7: 'Ноги', 8: 'Ступни', 11: 'Кольцо', 12: 'Кольцо', 13: 'Аксессуар', 14: 'Аксессуар', 16: 'Правая рука', 17: 'Левая рука', 18: 'Дальний бой' }; }
  function SLOTS_EN() { return { 1: 'Head', 2: 'Neck', 3: 'Shoulder', 15: 'Back', 5: 'Chest', 4: 'Shirt', 19: 'Tabard', 9: 'Wrist', 10: 'Hands', 6: 'Waist', 7: 'Legs', 8: 'Feet', 11: 'Finger', 12: 'Finger', 13: 'Trinket', 14: 'Trinket', 16: 'Main hand', 17: 'Off hand', 18: 'Ranged' }; }
  // layout: [slotId, col(0 left / 1 mid / 2 right), row]
  const LAYOUT = [
    [1, 0, 0], [10, 0, 1], [9, 0, 2], [16, 0, 3], [17, 0, 4], [18, 0, 5],
    [2, 2, 0], [11, 2, 1], [12, 2, 2], [13, 2, 3], [14, 2, 4], [15, 2, 5],
    [3, 1, 0], [5, 1, 1], [4, 1, 2], [19, 1, 3], [6, 1, 4], [7, 1, 5], [8, 1, 6],
  ];
  const ICON_SLOTS = { 1: 'inv_helmet_04', 3: 'inv_shoulder_09', 5: 'inv_chest_cloth_25', 7: 'inv_pants_02', 8: 'inv_boots_05', 10: 'inv_gauntlets_04', 6: 'inv_belt_03', 9: 'inv_bracer_02' };

  const $ = id => document.getElementById(id);
  const state = { char: null, gear: {}, tips: {} };

  function macroRun(file) {
    return (((window.MACRO_TXT || {})[lang] || {})[file] || '')
      .split('\n').filter(l => l.startsWith('/run')).join('\n');
  }

  function init() {
    document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.getAttribute('data-' + lang) || el.textContent; });
    document.title = (lang === 'ru' ? 'Герой' : 'Hero') + ' — WoW 3.3.5 Fury';
    $('hintSlot').innerHTML = window.W.hint(L[lang].hint, true);
    const m1 = macroRun('export-part1');
    const m2 = macroRun('export-part2');
    $('m1').innerHTML = `<button class="copy-btn" data-copy="${encodeURIComponent(m1)}">✓ ${L[lang].copy}</button><pre style="font-size:10.5px;max-height:74px">${m1.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
    $('m2').innerHTML = `<button class="copy-btn" data-copy="${encodeURIComponent(m2)}">✓ ${L[lang].copy}</button><pre style="font-size:10.5px;max-height:46px">${m2.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
    drawDoll();
    $('show').onclick = parse;
    $('clear').onclick = () => { state.char = null; state.gear = {}; drawDoll(); $('paste').value = ''; };
    $('demo').onclick = () => {
      $('paste').value = DEMO.join('\n'); parse();
    };
  }

  function parse() {
    const raw = $('paste').value;
    const lines = raw.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const char = { name: '?', cls: 'WARRIOR', lvl: 0, race: '', ap: 0, hp: 0, tal: [0, 0, 0] };
    const gear = {};
    let found = false;
    for (const ln of lines) {
      const m = ln.match(/^WEXP([012])\|(.*)$/);
      if (!m) continue;
      found = true;
      const p = m[2].split('|');
      if (m[1] === '1') {
        char.name = p[0]; char.cls = p[1] || 'WARRIOR'; char.lvl = +p[2] || 0;
        char.ap = +p[3] || 0; char.hp = +p[4] || 0;
        if (p[5]) char.tal = p[5].split('/').map(Number);
      } else if (m[1] === '0') {
        char.race = p[0] || '';
      } else {
        const slot = +p[0];
        const link = p.slice(1).join('|');
        const im = link.match(/item:(\d+)/);
        const nm = link.match(/\[([^\]]*)\]/);
        const name = nm ? nm[1] : link;
        // demo names -> real ids (for the built-in sample hero)
        const DEMO_IDS = { 'Наплечники из черного железа': 11605, 'Латы из черного железа': 11604,
          'Наголенники Быстрого бега': 11627, 'Перчатки шелковой паутины': 11634,
          'Разрушитель из черного железа': 17016, 'Рассекатель из черного железа': 11607 };
        const id = im ? +im[1] : (DEMO_IDS[name] || 0);
        if (slot && (im || nm)) gear[slot] = { id, name };
      }
    }
    if (!found) { alert(L[lang].err); return; }
    state.char = char; state.gear = gear;
    drawDoll();
    loadItemTips();
  }

  function drawDoll() {
    const slots = L[lang].slots();
    const c = state.char;
    const pd = $('pd');
    pd.innerHTML = '';
    const cells = {};
    LAYOUT.forEach(([slot, col, row]) => {
      const d = document.createElement('div');
      d.className = 'slot';
      d.dataset.slot = slot;
      const g = state.gear[slot];
      if (g) d.classList.add('has');
      d.innerHTML = `<img src="${window.W.icon(ICON_SLOTS[slot] || 'inv_misc_questionmark')}" alt="">`;
      d.onmouseenter = e => showTip(d, slot);
      d.onmouseleave = hideTip;
      cells[`${col},${row}`] = d;
    });
    for (let row = 0; row < 7; row++) for (let col = 0; col < 3; col++) {
      pd.appendChild(cells[`${col},${row}`] || Object.assign(document.createElement('div'), { className: 'slot empty' }));
    }
    // place remaining items (rings/trinkets duplicates are in LAYOUT already)
    if (c) {
      const clsRu = { WARRIOR: 'Воин', PALADIN: 'Паладин', HUNTER: 'Охотник', ROGUE: 'Разбойник', PRIEST: 'Жрец', SHAMAN: 'Шаман', MAGE: 'Маг', WARLOCK: 'Колдун', DRUID: 'Друид', DEATHKNIGHT: 'Рыцарь смерти' };
      $('cname').textContent = c.name;
      $('csub').textContent = `${lang === 'ru' ? clsRu[c.cls] || c.cls : c.cls} · ${lang === 'ru' ? 'ур.' : 'lvl'} ${c.lvl}${c.race ? ' · ' + c.race : ''}`;
      const labels = lang === 'ru'
        ? [['ap', 'Сила атаки'], ['hp', 'Здоровье'], ['t0', 'Оружие'], ['t1', 'Неистовство'], ['t2', 'Защита']]
        : [['ap', 'Attack Power'], ['hp', 'Health'], ['t0', 'Arms'], ['t1', 'Fury'], ['t2', 'Protection']];
      const vals = { ap: c.ap, hp: c.hp, t0: c.tal[0] || 0, t1: c.tal[1] || 0, t2: c.tal[2] || 0 };
      $('stats').innerHTML = labels.map(([k, l]) => `<div class="stat-box"><div class="v">${vals[k]}</div><div class="l">${l}</div></div>`).join('');
    } else {
      $('stats').innerHTML = '';
    }
  }

  async function loadItemTips() {
    for (const [slot, g] of Object.entries(state.gear)) {
      if (!g.id || state.tips[g.id]) continue;
      try {
        const r = await fetch(`https://nether.wowhead.com/wotlk/tooltip/item/${g.id}?locale=${lang}`);
        if (!r.ok) continue;
        const j = await r.json();
        state.tips[g.id] = j;
        const d = document.querySelector(`.slot[data-slot="${slot}"] img`);
        if (d && j.icon) d.src = `https://wow.zamimg.com/images/wow/icons/large/${j.icon}.jpg`;
      } catch (e) { /* offline: keep fallback icon */ }
    }
  }

  function showTip(el, slot) {
    const g = state.gear[slot];
    const tip = $('itemtip');
    if (!g) {
      const slots = L[lang].slots();
      tip.innerHTML = `<b>${slots[slot]}</b>`;
    } else {
      const t = state.tips[g.id];
      const qual = t ? (t.tooltip.match(/q\d/) || ['q2'])[0] : 'q2';
      if (t) {
        const clean = t.tooltip
          .replace(/<table[^>]*>/g, '').replace(/<\/table>/g, '')
          .replace(/<tr>/g, '').replace(/<\/tr>/g, '<br>')
          .replace(/<td[^>]*>/g, ' ').replace(/<\/td>/g, '')
          .replace(/<a[^>]*>/g, '').replace(/<\/a>/g, '')
          .replace(/<div[^>]*>/g, '').replace(/<\/div>/g, '<br>')
          .replace(/<br>\s*<br>/g, '<br>')
          .replace(/\s+/g, ' ');
        tip.innerHTML = `<b class="${qual === 'q1' ? '' : qual}" style="color:${QUAL_COLORS[qual] || '#fff'}">${t.name}</b><br>${clean}`;
      } else {
        tip.innerHTML = `<b>${g.name || '#' + g.id}</b>`;
      }
    }
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.right + 10, y = r.top;
    if (x + tw > innerWidth - 8) x = Math.max(8, r.left - tw - 10);
    if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const QUAL_COLORS = { q1: '#fff', q2: '#1eff00', q3: '#0070dd', q4: '#a335ee', q5: '#ff8000', q6: '#e6cc80', q0: '#9d9d9d' };
  function hideTip() { $('itemtip').style.display = 'none'; }

  const DEMO = [
    'WEXP1|Таррен|WARRIOR|54|742|4210|0/45/0',
    'WEXP0|Человек',
    'WEXP2|3|[Наплечники из черного железа]',
    'WEXP2|5|[Латы из черного железа]',
    'WEXP2|8|[Наголенники Быстрого бега]',
    'WEXP2|10|[Перчатки шелковой паутины]',
    'WEXP2|16|[Разрушитель из черного железа]',
    'WEXP2|17|[Рассекатель из черного железа]',
  ];

  init();
})();
</script>
</body>
</html>
